# Example compose file for the containerized pipeline (experimental).
# Copy next to your other stacks and adjust the volume paths.
#
#   music:  the library root (the pipeline manages <root>/spotiflac inside it)
#   state:  small JSON/txt state files, logs, quarantine list
#   config: holds spotiflac.env (start from config.example.env)
#
# The published image ships pinned, known-compatible deezer + tidal-web
# extensions — downloads work with zero registry setup. Configure
# SPOTIFLAC_REGISTRIES in config/spotiflac.env only if you deliberately
# want the live registry (its latest extensions may outrun the bridge).

services:
  spotiflac-pipeline:
    image: ghcr.io/ricky-bonder/spotiflac-pipeline:latest
    # or build locally:
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: spotiflac-pipeline
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      # SPOTIFLAC_TELEGRAM_BOT_TOKEN: ""
      # SPOTIFLAC_TELEGRAM_CHAT_ID: ""
    volumes:
      - /path/to/music:/music
      - ./state:/state
      - ./config:/config
    # The browser-based session solver needs a bit of shared memory.
    shm_size: 512m
